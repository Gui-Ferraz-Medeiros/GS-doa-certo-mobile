services:
  - type: web
    name: doacerto-mobile-api
    runtime: node
    plan: free
    region: ohio
    rootDir: deployment/api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
